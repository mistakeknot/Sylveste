[project]
name = "calibration-eval"
version = "0.1.0"
description = "Metacognitive calibration eval: do models know what they know, across domain types?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.50",
    "anthropic>=0.40",
    "openai>=1.50",
    "datasets>=2.20",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# run `pytest` from the experiment root; lets tests do `from src.metrics import ...`
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
