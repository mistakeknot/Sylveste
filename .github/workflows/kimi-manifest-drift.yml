name: Kimi manifest drift

# No `paths:` filter, deliberately.
#
# This job is a REQUIRED status check on main. A path-filtered workflow does not
# run on a commit that misses the filter, and GitHub does not treat "did not run"
# as "passed" — the required context stays pending forever and the branch is
# frozen. The filter and the requirement are mutually exclusive; the requirement
# is worth more, and the job is a two-file pytest run, so it costs nothing to
# always run it.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# What this workflow can and cannot check
# ---------------------------------------
# It guards the CHECKERS, not the estate. The monorepo .gitignore's os/, core/
# and interverse/, so a fresh actions/checkout contains none of the 62 plugins.
# Running `gen-kimi-manifests.py --check` here would inspect zero plugins,
# report zero stale manifests and exit 0 — a green check that looked at nothing.
#
# That is not a hypothetical. interverse-inventory.yml gates its real steps
# behind `[ -d interverse ]`, which is never true on a cloud runner, so it has
# been silently skipping them on every run.
#
# So: unit-test the resolution logic, and prove the vacuity guard fails loudly
# when a caller expects plugins and finds none. Estate-level enforcement lives
# where the plugins are — the per-repo parity check, and the pre-commit hook.
jobs:
  checkers:
    name: Generator and parity checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      - name: Asset-directory resolution tests
        run: python3 -m pytest tests/test_gen_kimi_manifests.py -q

      # Same shape of guard, different generator. gen-autonomy-position.py reads
      # a live kernel out of core/intercore, which this checkout does not have,
      # so CI tests the rendering and asserts the checker refuses to report on a
      # source-less tree. Real enforcement is the pre-commit hook.
      - name: Autonomy position rendering tests
        run: python3 -m pytest tests/test_gen_autonomy_position.py -q

      - name: Autonomy position checker refuses a kernel-less checkout
        run: |
          set +e
          python3 scripts/gen-autonomy-position.py --check
          rc=$?
          set -e
          echo "exit=$rc"
          test "$rc" -eq 2 || {
            echo "expected exit 2 (cannot verify) with no kernel present, got $rc" >&2
            echo "rc=0 would mean --check passed having compared nothing;" >&2
            echo "rc=1 would mean it called the block stale without reading a level." >&2
            exit 1
          }

      # An `ic` new enough to answer `autonomy status` but too old to report the
      # operation-floor table is a second vacuity trap: the floor table renders
      # empty and a rewrite deletes a true list. Unlike a missing kernel, this
      # one is cheap to simulate here, so CI covers it rather than leaving it to
      # whichever machine happens to have a stale binary installed.
      - name: Autonomy position checker refuses an ic that cannot report floors
        run: |
          set -e
          printf '#!/usr/bin/env bash\necho %s\n' \
            "'{\"level\":2,\"name\":\"n\",\"derives_auto_advance\":true,\"declared\":false,\"source\":\"s\"}'" \
            > /tmp/ic-no-ops
          chmod +x /tmp/ic-no-ops

          set +e
          IC_BIN=/tmp/ic-no-ops python3 scripts/gen-autonomy-position.py --check
          rc=$?
          set -e
          test "$rc" -eq 2 || {
            echo "expected exit 2 when \`ops\` is absent, got $rc" >&2
            echo "an ic without the floor table must not be treated as authoritative;" >&2
            echo "rendering its answer would erase the canon floor table." >&2
            exit 1
          }

          # An empty list is a real answer and must NOT be confused with absence.
          printf '#!/usr/bin/env bash\necho %s\n' \
            "'{\"level\":2,\"name\":\"n\",\"derives_auto_advance\":true,\"declared\":false,\"source\":\"s\",\"ops\":[]}'" \
            > /tmp/ic-empty-ops
          chmod +x /tmp/ic-empty-ops
          set +e
          IC_BIN=/tmp/ic-empty-ops python3 scripts/gen-autonomy-position.py --check
          rc=$?
          set -e
          test "$rc" -ne 2 || {
            echo "exit 2 for an explicitly empty ops list conflates 'no floors'" >&2
            echo "with 'cannot report floors'; a kernel with no floors is readable." >&2
            exit 1
          }

      # The installer shares .git/hooks/pre-commit with a beads-managed block.
      # Clobbering that block would disable beads' own hook silently, so prove
      # the install is idempotent and leaves a foreign block alone.
      - name: Pre-commit installer is idempotent and non-destructive
        run: |
          set -e
          bash -n scripts/pre-commit-hook.sh
          bash -n scripts/install-pre-commit-hook.sh

          printf '#!/usr/bin/env sh\n# --- BEGIN FOREIGN BLOCK ---\necho foreign\n# --- END FOREIGN BLOCK ---\n' \
            > .git/hooks/pre-commit
          chmod +x .git/hooks/pre-commit

          bash scripts/install-pre-commit-hook.sh
          bash scripts/install-pre-commit-hook.sh
          bash scripts/install-pre-commit-hook.sh --check

          grep -qF "# --- BEGIN FOREIGN BLOCK ---" .git/hooks/pre-commit || {
            echo "installer destroyed a pre-existing block" >&2; exit 1; }
          n="$(grep -cF '# --- BEGIN SYLVESTE AUTONOMY POSITION ---' .git/hooks/pre-commit)"
          test "$n" -eq 1 || { echo "expected 1 autonomy block, found $n" >&2; exit 1; }
          sh -n .git/hooks/pre-commit

      # The guard has to fail when nothing was inspected. If this step ever
      # passes, --check has become capable of reporting success on an empty
      # checkout, which is precisely the defect being prevented.
      - name: Vacuity guard fails on a plugin-less root
        run: |
          set +e
          python3 scripts/gen-kimi-manifests.py --check --root "$(mktemp -d)" --require-plugins 60
          rc=$?
          set -e
          echo "exit=$rc"
          test "$rc" -eq 2 || { echo "expected exit 2 from the vacuity guard, got $rc" >&2; exit 1; }

      - name: Parity checker fails on a plugin-less root
        run: |
          set +e
          python3 scripts/check-kimi-version-parity.py --root "$(mktemp -d)" --require-plugins 1
          rc=$?
          set -e
          echo "exit=$rc"
          test "$rc" -eq 2 || { echo "expected exit 2 from the parity vacuity guard, got $rc" >&2; exit 1; }

      - name: Parity checker rejects a bump without regeneration
        run: |
          set -e
          demo="$(mktemp -d)"
          mkdir -p "$demo/.claude-plugin"
          printf '{"name":"demo","version":"1.2.3"}\n' > "$demo/.claude-plugin/plugin.json"
          printf '{"name":"demo","version":"1.2.3"}\n' > "$demo/kimi.plugin.json"
          python3 scripts/check-kimi-version-parity.py --root "$demo" --require-plugins 1

          # Bump the source and leave the generated manifest behind — the exact
          # failure that let 21 of 62 manifests drift.
          printf '{"name":"demo","version":"1.2.4"}\n' > "$demo/.claude-plugin/plugin.json"
          set +e
          python3 scripts/check-kimi-version-parity.py --root "$demo" --require-plugins 1
          rc=$?
          set -e
          echo "exit=$rc"
          test "$rc" -eq 1 || { echo "expected exit 1 for a bump without regeneration, got $rc" >&2; exit 1; }

      - name: Report where real enforcement lives
        run: |
          {
            echo "### Kimi manifest drift"
            echo
            echo "Checkers verified. **This job does not check the estate** —"
            echo "the monorepo gitignores \`os/\`, \`core/\` and \`interverse/\`, so a"
            echo "cloud checkout has none of the 62 plugins."
            echo
            echo "Estate enforcement:"
            echo "- \`scripts/check-kimi-version-parity.py\` in each plugin repo (self-contained)"
            echo "- the pre-commit hook, which runs where the monorepo is materialised"
            echo "- \`gen-kimi-manifests.py --check --require-plugins 60\` on a full local checkout"
          } >> "$GITHUB_STEP_SUMMARY"
